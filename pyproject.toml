# Virtual uv workspace: no package here, only the members and shared dev tools.
[tool.uv.workspace]
members = ["orchestrator", "eval", "train"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests", "eval/tests", "train/tests", "tests"]
# Lets tests import their shared sample module by name.
pythonpath = ["orchestrator/tests", "eval/tests", "train/tests"]
addopts = "--import-mode=importlib"
