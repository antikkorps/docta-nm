[project]
name = "docta-train"
version = "0.0.1"
description = "Trains the Docta-nm core from scratch, one loop state at a time"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "docta-orchestrator",
    "numpy>=2.5.5",
    "torch",
]

[tool.uv.sources]
docta-orchestrator = { workspace = true }
# CPU-only wheels: the core is small enough to train without a GPU, and the
# default (CUDA) wheels weigh several GB for nothing.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
