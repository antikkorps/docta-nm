name: CI

on:
  push:
  pull_request:

# The job only reads the code: the token gets no write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docta
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: docta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U docta -d docta"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Throwaway credentials of the CI service above; no .env exists in CI.
      DATABASE_URL: postgresql://docta:ci-only@127.0.0.1:5432/docta
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes no major tag (v10): pin the full version.
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Apply the database schema
        # Service containers cannot mount db/schema.sql into initdb.d.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: uv sync --locked
      - name: Every pre-push check
        run: just test
      - name: Phase 0 chain end to end (small dataset)
        run: just gen 42 50 && just load && just baseline
      - name: Training chain end to end (small dataset)
        # Needs the data, the database and the predictions of the baseline step
        # above (`just core` scores next to them). One epoch on the tiny
        # dataset: it checks that the chain runs, not that the core is good.
        # Caps sized for the runner (about 16 GB, 4 cores); the time budget
        # keeps a hang from eating the job.
        run: just evaluate-data && just fit --epochs 1 --max-gb 12 --threads 4 --max-minutes 10 && just core
