name: CI

on:
  # Branch pushes alone would run the workflow twice per pull request (push
  # and pull_request): push only on the protected branches.
  push:
    branches: [main, dev]
  pull_request:

# The job only reads the code: the token gets no write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docta
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: docta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U docta -d docta"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Throwaway credentials of the CI service above; no .env exists in CI.
      DATABASE_URL: postgresql://docta:ci-only@127.0.0.1:5432/docta
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes no major tag (v10): pin the full version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Caches the uv download cache, keyed on uv.lock: the PyTorch CPU
          # wheels are heavy.
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Apply the database schema
        # Service containers cannot mount db/schema.sql into initdb.d.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Schema smoke check (db/check.sql)
        # `just check-db` goes through docker compose; here the database is a
        # service container, so run the same file with psql.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/check.sql
      - run: uv sync --locked
      - name: Every pre-push check
        run: just test
      - name: Phase 0 chain end to end (small dataset)
        run: just gen 42 50 && just load && just baseline
