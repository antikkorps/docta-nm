[project]
name = "docta-orchestrator"
version = "0.0.1"
description = "Loader, loop state machine, search tool and fake models for Docta-nm"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
